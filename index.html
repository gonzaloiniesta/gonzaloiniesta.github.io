<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Navidad</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100svh;
  overflow: hidden;
  background: #000;
  font-family: "Playfair Display", serif;
}

/* ZOOM IN */
@keyframes zoomIn {
  from { transform: scale(0.94); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

/* ESCENA */
.wrapper {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at bottom, rgba(255,120,60,0.25), transparent 55%),
    linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
    url("https://images.unsplash.com/photo-1543589077-47d81606c1bf")
      center / cover no-repeat;
}

.wrapper::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 60%);
  pointer-events: none;
}

/* LIBRO */
.book {
  position: relative;
  width: 320px;
  height: 440px;
  max-width: 90vw;
  max-height: calc(90svh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  perspective: 2000px;
  animation: zoomIn 1.2s ease-out forwards;
}

/* PORTADA */
.cover {
  position: absolute;
  inset: 0;
  background: url("https://images.unsplash.com/photo-1512389142860-9c449e58a543")
    center / cover;
  transform-origin: left;
  transition: transform 2s ease, opacity 1s ease;
  box-shadow: 0 25px 70px rgba(0,0,0,.9);
  z-index: 2;
}

.cover::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.45);
}

.cover-content {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  color: white;
}

.cover h1 {
  font-family: "Great Vibes", cursive;
  font-size: 3rem;
}

.cover p {
  font-family: "Great Vibes", cursive;
  font-size: 1.8rem;
}

.cover button {
  margin-top: 25px;
  padding: 16px 34px;
  border-radius: 30px;
  border: none;
  background: #b71c1c;
  color: white;
  font-family: "Great Vibes", cursive;
  font-size: 1.6rem;
  cursor: pointer;
}

/* INTERIOR */
.inside {
  position: absolute;
  inset: 0;
  background: url("https://images.unsplash.com/photo-1543946603-0f7d10e62d86")
    center / cover;
  opacity: 0;
  z-index: 1;
  overflow: hidden;
}

/* LUZ */
.inside::before {
  content: "";
  position: absolute;
  bottom: -20%;
  left: -20%;
  width: 140%;
  height: 60%;
  background: radial-gradient(
    ellipse at center,
    rgba(255,120,60,0.35),
    rgba(255,120,60,0.15),
    transparent 70%
  );
  animation: fireGlow 3s infinite alternate;
}

@keyframes fireGlow {
  from { opacity: 0.6; }
  to   { opacity: 1; }
}

.inside::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.3),
    rgba(0,0,0,.65)
  );
}

/* MENSAJE */
.message {
  position: absolute;
  top: 24%;
  width: 100%;
  text-align: center;
  color: white;
}

.message p,
.message h2 {
  font-family: "Great Vibes", cursive;
}

.message p { font-size: 1.8rem; }
.message h2 { font-size: 3.2rem; }

/* FIRMA */
.signature {
  position: absolute;
  bottom: env(safe-area-inset-bottom, 20px);
  width: 100%;
  text-align: center;
  font-family: "Great Vibes", cursive;
  color: white;
  font-size: 1.2rem;
  opacity: 0.7;
}

/* NIEVE */
.snow {
  position: absolute;
  top: -10%;
  width: 6px;
  height: 6px;
  background: white;
  border-radius: 50%;
  opacity: .8;
  animation: fall linear infinite;
}

@keyframes fall {
  to { transform: translateY(120vh); }
}

/* ESTADO ABIERTO */
.book.open .cover {
  transform: rotateY(-160deg);
  opacity: 0;
}

.book.open .inside {
  opacity: 1;
  transition: opacity 2s ease;
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="book" id="book">

    <div class="cover">
      <div class="cover-content">
        <h1>Llevamos todo el año esperando...</h1>
        <p>Pulsa el botón<br>Sube el volumen<br>Y disfruta</p>
        <button onclick="openBook(); countClick();">Abrir</button>
      </div>
    </div>

    <div class="inside">
      <div class="message">
        <p>Te deseo una</p>
        <h2>Feliz Navidad<br>❤️</h2>
      </div>
      <div class="signature">by gonzaloiniesta</div>
    </div>

  </div>
</div>

<audio id="music" src="music/José Feliciano - Feliz Navidad (Official Audio).mp3"></audio>

<script>
/* CONTADOR */
async function countClick() {
  fetch("https://countapi.xyz/hit/gonzaloiniesta-feliz-navidad/open-book-clicks");
}

/* ABRIR LIBRO */
function openBook() {
  const book = document.getElementById("book");
  book.classList.add("open");

  const music = document.getElementById("music");
  music.volume = 0;
  music.play();

  let v = 0;
  const fade = setInterval(() => {
    v += 0.02;
    music.volume = Math.min(v, 1);
    if (v >= 1) clearInterval(fade);
  }, 150);

  startSnow();
}

/* NIEVE */
function startSnow() {
  setInterval(() => {
    const s = document.createElement("div");
    s.className = "snow";
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (6 + Math.random() * 6) + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 12000);
  }, 150);
}
</script>

</body>
</html>
