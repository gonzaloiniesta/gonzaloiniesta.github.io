<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Hace que el ancho virtual de la página coincida con el ancho real del dispositivo -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Página Móvil</title>
  <style>
    /* Reset sencillo */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      /* Asegura que el body ocupe toda la altura visible */
      min-height: 100vh;
    }
    .container {
      /* Ancho máximo típico de móvil (puedes ajustar) */
      max-width: 400px;
      /* Ocupa el 100% hasta ese máximo */
      width: 100%;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      /* Altura: llena todo el alto de la ventana */
      min-height: 100vh;
    }
    header, main, footer {
      padding: 16px;
    }
    header {
      background: #0070f3;
      color: white;
      text-align: center;
    }
    main {
      flex: 1; /* para que el contenido principal crezca */
    }
    footer {
      text-align: center;
      font-size: 0.9em;
      color: #666;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Mi App Móvil</h1>
    </header>
    <main>
      <p>¡Bienvenido! Este es un contenedor de ejemplo con tamaño de móvil.</p>
    </main>
    <footer>
      &copy; 2025 Mi Nombre
    </footer>
  </div>
</body>
</html>
