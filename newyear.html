<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Año 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ================= BODY ================= */
body {
  min-height: 100svh;
  overflow: hidden;
  background: #000;
  font-family: "Playfair Display", serif;
}

/* ================= ZOOM IN ================= */
@keyframes zoomIn {
  from { transform: scale(0.94); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

/* ================= ESCENA AÑO NUEVO ================= */
.wrapper {
  position: fixed;
  inset: 0;

  display: flex;
  justify-content: center;
  align-items: center;

  background:
    radial-gradient(circle at bottom, rgba(255,200,100,0.25), transparent 55%),
    linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.85)),
    url("https://images.unsplash.com/photo-1513151233558-d860c5398176")
      center / cover no-repeat;
}

.wrapper::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top, rgba(255,255,255,0.1), transparent 60%);
  pointer-events: none;
}

/* ================= LIBRO ================= */
.book {
  position: relative;
  width: 320px;
  height: 440px;
  max-width: 90vw;
  max-height: calc(90svh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  perspective: 2000px;
  animation: zoomIn 1.2s ease-out forwards;
}

/* ================= PORTADA ================= */
.cover {
  position: absolute;
  inset: 0;
  background: url("https://images.unsplash.com/photo-1482517967863-00e15c9b44be")
    center / cover;
  transform-origin: left;
  transition: transform 2s ease, opacity 1s ease;
  box-shadow: 0 25px 70px rgba(0,0,0,.9);
  z-index: 2;
}

.cover::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.45);
}

.cover-content {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  color: white;
}

.cover h1 {
  font-family: "Great Vibes", cursive;
  font-size: 2.8rem;
  margin-bottom: 12px;
}

.cover p {
  font-family: "Great Vibes", cursive;
  font-size: 1.7rem;
  line-height: 1.4;
}

.cover button {
  margin-top: 25px;
  padding: 16px 36px;
  border-radius: 30px;
  border: none;
  background: linear-gradient(45deg, #d4af37, #ffdd75);
  color: #000;
  font-family: "Great Vibes", cursive;
  font-size: 1.6rem;
  cursor: pointer;
}

/* ================= INTERIOR ================= */
.inside {
  position: absolute;
  inset: 0;
  background: url("https://images.unsplash.com/photo-1519681393784-d120267933ba")
    center / cover;
  opacity: 0;
  z-index: 1;
  overflow: hidden;
}

/* LUZ FESTIVA */
.inside::before {
  content: "";
  position: absolute;
  inset: -20%;
  background: radial-gradient(circle, rgba(255,200,100,0.25), transparent 60%);
  animation: glow 4s infinite alternate;
}

@keyframes glow {
  from { opacity: 0.6; }
  to   { opacity: 1; }
}

.inside::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,.3), rgba(0,0,0,.7));
}

/* ================= MENSAJE ================= */
.message {
  position: absolute;
  top: 24%;
  width: 100%;
  text-align: center;
  color: white;
  padding: 20px;
  z-index: 2;
}

.message p {
  font-family: "Great Vibes", cursive;
  font-size: 1.8rem;
}

.message h2 {
  font-family: "Great Vibes", cursive;
  font-size: 3.4rem;
  margin-top: 5px;
}

/* ================= FIRMA ================= */
.signature {
  position: absolute;
  bottom: env(safe-area-inset-bottom, 20px);
  width: 100%;
  text-align: center;
  font-family: "Great Vibes", cursive;
  color: white;
  font-size: 1.2rem;
  opacity: 0.75;
}

/* ================= CONFETI ================= */
.confetti {
  position: absolute;
  top: -10%;
  width: 6px;
  height: 6px;
  background: gold;
  opacity: 0.9;
  animation: fall linear infinite;
}

@keyframes fall {
  to { transform: translateY(120vh) rotate(360deg); }
}

/* ================= ESTADO ABIERTO ================= */
.book.open .cover {
  transform: rotateY(-160deg);
  opacity: 0;
}

.book.open .inside {
  opacity: 1;
  transition: opacity 2s ease;
}

/* ================= RESPONSIVE ================= */
@media (max-width: 480px) {
  .book {
    width: 320px;
    height: 500px;
  }

  .message h2 {
    font-size: 3rem;
  }
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="book" id="book">

    <!-- PORTADA -->
    <div class="cover">
      <div class="cover-content">
        <h1>Se acerca un nuevo comienzo…</h1>
        <p>
          Pulsa el botón<br>
          Sube el volumen<br>
          Y brinda por lo que viene
        </p>
        <button onclick="openBook(); countClick();">Abrir</button>
      </div>
    </div>

    <!-- INTERIOR -->
    <div class="inside">
      <div class="message">
        <p>Te deseo un</p>
        <h2>Feliz Año 2026 ✨</h2>
      </div>

      <div class="signature">
        by gonzaloiniesta
      </div>
    </div>

  </div>
</div>

<audio id="music" src="music/feliz-ano-2026.mp3"></audio>

<script>
/* ================= CONTADOR ================= */
function countClick() {
  fetch("https://countapi.xyz/hit/gonzaloiniesta-feliz-ano-2026/open-book-clicks");
}

/* ================= ABRIR LIBRO ================= */
function openBook() {
  const book = document.getElementById("book");
  book.classList.add("open");

  const music = document.getElementById("music");
  music.volume = 0;
  music.play();

  let v = 0;
  const fade = setInterval(() => {
    v += 0.02;
    music.volume = Math.min(v, 1);
    if (v >= 1) clearInterval(fade);
  }, 150);

  startConfetti();
}

/* ================= CONFETI ================= */
function startConfetti() {
  setInterval(() => {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.animationDuration = (4 + Math.random() * 4) + "s";
    c.style.background =
      ["#ffd700", "#ffffff", "#ffcc66"][Math.floor(Math.random() * 3)];
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 10000);
  }, 180);
}
</script>

</body>
</html>
